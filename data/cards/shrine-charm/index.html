<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>神社御守</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:linear-gradient(135deg,#f5e6c8,#e8d5a3);padding:20px;font-family:'Georgia','SimSun',serif}
.card{position:relative;max-width:400px;width:100%;background:linear-gradient(180deg,#fffef5 0%,#f7f0d8 100%);padding:35px 30px;border-radius:3px;box-shadow:0 8px 30px rgba(120,90,40,0.25),inset 0 1px 0 rgba(255,255,255,0.6);overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:repeating-linear-gradient(0deg,transparent,transparent 24px,rgba(180,160,120,0.15) 24px,rgba(180,160,120,0.15) 25px);pointer-events:none}
.card::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(ellipse at center,rgba(255,220,150,0.1) 0%,transparent 70%);pointer-events:none;animation:shimmer 8s ease-in-out infinite}
@keyframes shimmer{0%,100%{transform:translate(-10%,-10%)}50%{transform:translate(10%,10%)}}
.title{text-align:center;font-size:20px;color:#6b4226;margin-bottom:20px;letter-spacing:3px;position:relative;z-index:1}
.title::after{content:'';display:block;width:60px;height:2px;background:linear-gradient(90deg,transparent,#8b6914,transparent);margin:8px auto 0}
.fields{position:relative;z-index:1}
.field{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed rgba(139,105,20,0.2);font-size:13px}
.field:last-child{border-bottom:none}
.label{color:#8b6914;font-weight:bold}
.value{color:#4a3728;text-align:right;max-width:60%}
.seal{text-align:center;margin-top:20px;font-size:24px;opacity:0.4;position:relative;z-index:1}
.corner{position:absolute;width:25px;height:25px;opacity:0.2;border-color:#8b6914}
.corner.tl{top:8px;left:8px;border-top:2px solid;border-left:2px solid}
.corner.tr{top:8px;right:8px;border-top:2px solid;border-right:2px solid}
.corner.bl{bottom:8px;left:8px;border-bottom:2px solid;border-left:2px solid}
.corner.br{bottom:8px;right:8px;border-bottom:2px solid;border-right:2px solid}
</style>
</head>
<body>
<div class="card">
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<h2 class="title">神社御守</h2>
<div class="fields">
<div class="field"><span class="label">wish:</span><span class="value">{{wish}}</span></div>
        <div class="field"><span class="label">shrine:</span><span class="value">{{shrine}}</span></div>
        <div class="field"><span class="label">date:</span><span class="value">{{date}}</span></div>
        <div class="field"><span class="label">content:</span><span class="value">{{content}}</span></div>
        <div class="field"><span class="label">wishType:</span><span class="value">{{wishType}}</span></div>
</div>
<div class="seal">&#9752;</div>
</div>
</body>
</html>

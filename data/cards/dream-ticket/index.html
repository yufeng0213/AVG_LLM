<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ticket</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:flex;justify-content:center;align-items:center;background:#080810;padding:20px;font-family:'Courier New',monospace;overflow:hidden}
.card{position:relative;max-width:400px;width:100%;background:linear-gradient(135deg,rgba(0,255,255,0.05),rgba(255,0,255,0.05));border:1px solid rgba(0,255,255,0.3);padding:30px 25px;animation:float 4s ease-in-out infinite;backdrop-filter:blur(5px)}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(0,255,255,0.03),transparent);animation:scan 3s linear infinite;pointer-events:none}
@keyframes scan{0%{transform:translateY(-100%)}100%{transform:translateY(100%)}}
.title{text-align:center;font-size:20px;color:#0ff;margin-bottom:25px;letter-spacing:4px;text-shadow:0 0 10px #0ff,0 0 20px rgba(0,255,255,0.5)}
.fields{}
.field{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(0,255,255,0.1);font-size:12px}
.field:last-child{border-bottom:none}
.label{color:rgba(0,255,255,0.5);letter-spacing:1px}
.value{color:#0ff;text-shadow:0 0 5px rgba(0,255,255,0.3);text-align:right;max-width:55%}
.glow-line{position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,#0ff,#f0f,#0ff,transparent);animation:glow-pulse 2s ease-in-out infinite}
@keyframes glow-pulse{0%,100%{opacity:0.3}50%{opacity:1}}
.dot{position:absolute;top:10px;right:10px;width:6px;height:6px;background:#0f0;border-radius:50%;animation:pulse 1s infinite;box-shadow:0 0 8px #0f0}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.corner{position:absolute;width:15px;height:15px;border-color:#0ff}
.corner.tl{top:4px;left:4px;border-top:1px solid;border-left:1px solid}
.corner.tr{top:4px;right:4px;border-top:1px solid;border-right:1px solid}
.corner.bl{bottom:4px;left:4px;border-bottom:1px solid;border-left:1px solid}
.corner.br{bottom:4px;right:4px;border-bottom:1px solid;border-right:1px solid}
</style>
</head>
<body>
<div class="card">
<div class="dot"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>
<h2 class="title">ticket</h2>
<div class="fields">
<div class="field"><span class="label">dreamer:</span><span class="value">{{dreamer}}</span></div>
        <div class="field"><span class="label">ticketNo:</span><span class="value">{{ticketNo}}</span></div>
        <div class="field"><span class="label">dreamType:</span><span class="value">{{dreamType}}</span></div>
        <div class="field"><span class="label">duration:</span><span class="value">{{duration}}</span></div>
        <div class="field"><span class="label">date:</span><span class="value">{{date}}</span></div>
        <div class="field"><span class="label">gatekeeper:</span><span class="value">{{gatekeeper}}</span></div>
        <div class="field"><span class="label">rules:</span><span class="value">{{rules}}</span></div>
</div>
<div class="glow-line"></div>
</div>
</body>
</html>

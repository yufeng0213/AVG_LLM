<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>邀请函</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: 'Georgia', 'Times New Roman', serif;
      padding: 20px;
    }
    .invitation {
      width: 100%;
      max-width: 450px;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      overflow: hidden;
    }
    .inv-header {
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      padding: 30px;
      text-align: center;
      color: #fff;
    }
    .inv-icon { font-size: 36px; margin-bottom: 10px; }
    .inv-title { font-size: 20px; letter-spacing: 3px; }
    .inv-body { padding: 30px; }
    .inv-greeting { font-size: 15px; color: #555; margin-bottom: 15px; }
    .inv-content { font-size: 14px; line-height: 1.8; color: #444; white-space: pre-wrap; margin-bottom: 20px; }
    .inv-details {
      background: #f8f6ff;
      border-radius: 8px;
      padding: 15px 20px;
      font-size: 13px;
      color: #666;
      line-height: 2;
    }
    .inv-details strong { color: #764ba2; }
    .inv-footer {
      padding: 20px 30px;
      text-align: right;
      font-size: 13px;
      color: #999;
      border-top: 1px solid #eee;
    }
    .inv-sender { font-size: 15px; color: #764ba2; font-weight: bold; }
  </style>
</head>
<body>
  <div class="invitation">
    <div class="inv-header">
      <div class="inv-icon">✉️</div>
      <div class="inv-title">{{title}}</div>
    </div>
    <div class="inv-body">
      <div class="inv-greeting">{{greeting}}</div>
      <div class="inv-content">{{content}}</div>
      <div class="inv-details">
        <div>📅 <strong>时间：</strong>{{time}}</div>
        <div>📍 <strong>地点：</strong>{{location}}</div>
        <div>👤 <strong>邀请人：</strong>{{sender}}</div>
      </div>
    </div>
    <div class="inv-footer">
      <div class="inv-sender">{{sender}}</div>
      <div>{{date}}</div>
    </div>
  </div>
</body>
</html>

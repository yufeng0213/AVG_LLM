<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>试卷</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: #fff;
      font-family: 'SimSun', '宋体', serif;
      padding: 30px 20px;
    }
    .exam {
      max-width: 600px;
      margin: 0 auto;
      border: 2px solid #333;
      padding: 30px;
      background: #fff;
    }
    .exam-header {
      text-align: center;
      border-bottom: 2px solid #333;
      padding-bottom: 15px;
      margin-bottom: 20px;
    }
    .exam-title {
      font-size: 22px;
      font-weight: bold;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }
    .exam-subtitle {
      font-size: 13px;
      color: #666;
    }
    .exam-info {
      display: flex;
      justify-content: space-between;
      margin-bottom: 20px;
      font-size: 13px;
      color: #555;
    }
    .exam-info span { border-bottom: 1px solid #999; padding-bottom: 2px; min-width: 80px; }
    .exam-section-title {
      font-size: 15px;
      font-weight: bold;
      margin: 20px 0 10px;
      padding-left: 8px;
      border-left: 3px solid #333;
    }
    .exam-content {
      font-size: 14px;
      line-height: 2;
      color: #333;
      white-space: pre-wrap;
    }
    .exam-footer {
      margin-top: 30px;
      padding-top: 15px;
      border-top: 1px dashed #999;
      text-align: right;
      font-size: 13px;
      color: #666;
    }
    .seal {
      position: absolute;
      top: 20px;
      right: 40px;
      width: 60px;
      height: 60px;
      border: 2px solid #c0392b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #c0392b;
      font-size: 12px;
      font-weight: bold;
      transform: rotate(-15deg);
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <div class="exam" style="position:relative;">
    <div class="seal">{{seal}}</div>
    <div class="exam-header">
      <div class="exam-title">{{title}}</div>
      <div class="exam-subtitle">{{subtitle}}</div>
    </div>
    <div class="exam-info">
      <div>姓名：<span>{{student}}</span></div>
      <div>出题人：<span>{{sender}}</span></div>
      <div>日期：<span>{{date}}</span></div>
    </div>
    <div class="exam-section-title">试题内容</div>
    <div class="exam-content">{{content}}</div>
    <div class="exam-footer">出题人：{{sender}}</div>
  </div>
</body>
</html>

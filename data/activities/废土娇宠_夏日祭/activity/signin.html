<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>签到 - 废土娇宠·夏日祭</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    .signin-page {
      width: 100%;
      height: 100%;
      padding-bottom: 80px;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0a1628 0%, #132a4a 40%, #0d1f3c 100%);
      overflow: hidden;
      font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
    }

    /* ===== 顶部 Banner ===== */
    .signin-banner {
      position: relative;
      flex-shrink: 0;
      height: 220px;
      padding: 24px 24px 0;
      background: linear-gradient(180deg, rgba(10,22,40,0.95) 0%, rgba(19,42,74,0.3) 100%);
      overflow: hidden;
    }

    .banner-reset-btn {
      position: absolute;
      top: 48px; right: 12px;
      background: rgba(255,107,107,0.15);
      border: 1px solid rgba(255,107,107,0.3);
      border-radius: 6px;
      color: rgba(255,107,107,0.6);
      font-size: 11px;
      padding: 4px 10px;
      cursor: pointer;
      z-index: 10;
      transition: all 0.2s;
    }

    .banner-reset-btn:hover {
      background: rgba(255,107,107,0.25);
      color: #ff6b6b;
    }

    .banner-title-wrap {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 8px;
    }

    .banner-title {
      font-size: 42px;
      font-weight: 800;
      color: #e8f4ff;
      text-shadow: 0 2px 12px rgba(72,209,204,0.3);
      letter-spacing: 4px;
    }

    .banner-title-en {
      font-size: 14px;
      color: rgba(72,209,204,0.4);
      letter-spacing: 3px;
      font-weight: 400;
    }

    .banner-subtitle {
      font-size: 16px;
      color: rgba(232,244,255,0.7);
      margin-bottom: 4px;
    }

    .banner-subtitle .highlight {
      color: #48d1cc;
      font-weight: 700;
    }

    .banner-subtitle .reward-name {
      display: block;
      font-size: 20px;
      margin-top: 6px;
    }

    .banner-streak {
      font-size: 14px;
      color: rgba(72,209,204,0.8);
      margin-top: 8px;
      font-weight: 600;
    }

    .banner-note {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
    }

    .banner-character-placeholder {
      position: absolute;
      right: 20px;
      bottom: 0;
      width: 200px;
      height: 200px;
      object-fit: contain;
      object-position: bottom center;
    }

    /* ===== 签到日期列表 ===== */
    .signin-days {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 12px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .signin-days::-webkit-scrollbar {
      width: 4px;
    }

    .signin-days::-webkit-scrollbar-thumb {
      background: rgba(72,209,204,0.2);
      border-radius: 2px;
    }

    /* ===== 单日卡片 ===== */
    .day-card {
      position: relative;
      display: flex;
      align-items: stretch;
      min-height: 80px;
      border-radius: 6px;
      overflow: hidden;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    /* 卡片背景色 — 夏日清凉配色 */
    .day-card.unclaimed {
      background: linear-gradient(135deg, #e8f4ff 0%, #d4eef9 100%);
    }

    .day-card.claimable {
      background: linear-gradient(135deg, #f0faff 0%, #d4eef9 100%);
      box-shadow: 0 0 0 1px rgba(72,209,204,0.4), 0 0 16px rgba(72,209,204,0.12);
      animation: card-pulse 2s ease-in-out infinite;
      cursor: pointer;
    }

    .day-card.claimed {
      background: linear-gradient(135deg, #1a2a44 0%, #13203a 100%);
    }

    @keyframes card-pulse {
      0%, 100% { box-shadow: 0 0 0 1px rgba(72,209,204,0.3), 0 0 12px rgba(72,209,204,0.08); }
      50% { box-shadow: 0 0 0 1px rgba(72,209,204,0.6), 0 0 20px rgba(72,209,204,0.2); }
    }

    /* 卡片四角标记 */
    .day-card::before,
    .day-card::after {
      content: '';
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(72,209,204,0.3);
      z-index: 2;
    }

    .day-card::before { top: 4px; left: 4px; }
    .day-card::after { top: 4px; right: 4px; }

    .day-card .corner-bl,
    .day-card .corner-br {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(72,209,204,0.3);
      z-index: 2;
    }

    .day-card .corner-bl { bottom: 4px; left: 4px; }
    .day-card .corner-br { bottom: 4px; right: 4px; }

    /* 英文水印 */
    .day-card .day-watermark {
      position: absolute;
      font-size: 48px;
      font-weight: 900;
      color: rgba(72,209,204,0.08);
      top: 50%;
      left: 60px;
      transform: translateY(-50%);
      pointer-events: none;
      letter-spacing: 2px;
      user-select: none;
    }

    .day-card.claimed .day-watermark {
      color: rgba(255,255,255,0.04);
    }

    /* 左侧：日期数字 */
    .day-left {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      padding: 12px 16px;
      min-width: 80px;
      flex-shrink: 0;
      position: relative;
    }

    .day-label {
      font-size: 14px;
      color: rgba(72,209,204,0.6);
      margin-bottom: -4px;
    }

    .day-card.claimed .day-label {
      color: rgba(255,255,255,0.3);
    }

    .day-number {
      font-size: 40px;
      font-weight: 900;
      color: #1a4a6a;
      line-height: 1;
    }

    .day-card.claimed .day-number {
      color: rgba(255,255,255,0.15);
    }

    .day-number .day-suffix {
      font-size: 18px;
      font-weight: 600;
      margin-left: 2px;
    }

    /* NEW! 角标 */
    .day-new-badge {
      position: absolute;
      top: -2px;
      left: -2px;
      background: linear-gradient(135deg, #ff8c42, #ff6b6b);
      color: #fff;
      font-size: 10px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 3px;
      letter-spacing: 1px;
      transform: rotate(-5deg);
    }

    /* 中间：奖励信息 */
    .day-center {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      min-width: 0;
      border-right: 1px dashed rgba(72,209,204,0.2);
    }

    .day-card.claimed .day-center {
      border-right-color: rgba(255,255,255,0.08);
    }

    .day-reward-icon {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      background: rgba(72,209,204,0.08);
      border: 1px solid rgba(72,209,204,0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      position: relative;
      overflow: hidden;
    }

    .day-card.claimed .day-reward-icon {
      background: rgba(255,255,255,0.05);
      border-color: rgba(255,255,255,0.08);
    }

    .day-reward-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .day-reward-icon .icon-placeholder {
      font-size: 28px;
      opacity: 0.6;
    }

    .day-reward-amount {
      position: absolute;
      bottom: 2px;
      right: 4px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      font-weight: 600;
    }

    .day-reward-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .day-reward-name {
      font-size: 15px;
      font-weight: 600;
      color: #1a4a6a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .day-card.claimed .day-reward-name {
      color: rgba(255,255,255,0.3);
    }

    .day-reward-type {
      font-size: 11px;
      color: rgba(72,209,204,0.5);
    }

    .day-card.claimed .day-reward-type {
      color: rgba(255,255,255,0.2);
    }

    /* 右侧：领取按钮 */
    .day-right {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 16px;
      flex-shrink: 0;
    }

    .day-btn {
      padding: 8px 20px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
      min-width: 100px;
      text-align: center;
    }

    .day-btn.claim {
      background: linear-gradient(135deg, #48d1cc, #3bb8b4);
      color: #fff;
      box-shadow: 0 2px 8px rgba(72,209,204,0.3);
    }

    .day-btn.claim:hover {
      background: linear-gradient(135deg, #58e0da, #48d1cc);
      box-shadow: 0 4px 12px rgba(72,209,204,0.4);
      transform: translateY(-1px);
    }

    .day-btn.claim:active {
      transform: translateY(0) scale(0.98);
    }

    .day-btn.pending {
      background: rgba(72,209,204,0.08);
      color: rgba(72,209,204,0.4);
      cursor: default;
    }

    .day-btn.done {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.25);
      cursor: default;
    }

    /* 签到成功动画 */
    .signin-success-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.7);
      animation: overlay-fade-in 0.3s ease;
    }

    @keyframes overlay-fade-in {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .signin-success-card {
      width: 180px;
      height: 220px;
      background: linear-gradient(135deg, #48d1cc 0%, #3bb8b4 100%);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: card-fly-in 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
      box-shadow: 0 0 40px rgba(72,209,204,0.5);
    }

    @keyframes card-fly-in {
      from { transform: translateY(-100vh) scale(0.5); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .signin-success-icon {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .signin-success-icon img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .signin-success-icon .icon-placeholder {
      font-size: 48px;
    }

    .signin-success-text {
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      text-align: center;
    }

    .signin-success-amount {
      font-size: 16px;
      color: rgba(255,255,255,0.9);
    }

    /* 粒子爆发效果 */
    .signin-sparkle {
      position: absolute;
      width: 8px;
      height: 8px;
      background: #48d1cc;
      border-radius: 50%;
      animation: sparkle-burst 0.8s ease-out forwards;
    }

    @keyframes sparkle-burst {
      from { transform: translate(0, 0) scale(1); opacity: 1; }
      to { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* ===== 底部：连续登录 ===== */
    .signin-footer {
      flex-shrink: 0;
      padding: 8px 16px 12px;
      background: linear-gradient(0deg, rgba(10,22,40,0.9) 0%, transparent 100%);
    }

    .footer-title {
      font-size: 16px;
      font-weight: 700;
      color: #e8f4ff;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-title::before {
      content: '▶';
      font-size: 10px;
      color: #48d1cc;
    }

    .footer-card {
      display: flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(135deg, #1a2a44 0%, #13203a 100%);
      border: 1px solid rgba(72,209,204,0.2);
      border-radius: 8px;
      padding: 10px 16px;
    }

    .footer-card-info {
      font-size: 14px;
      color: #e8f4ff;
    }

    .footer-card-info .reward-highlight {
      color: #48d1cc;
      font-weight: 700;
    }

    .footer-card-image {
      width: 60px;
      height: 60px;
      border-radius: 8px;
      background: rgba(255,255,255,0.05);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      overflow: hidden;
    }

    .footer-card-image img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .footer-card-image .img-placeholder {
      font-size: 36px;
      opacity: 0.3;
    }

    /* Toast */
    .wa-toast {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%,-50%);
      background: rgba(0,0,0,0.85);
      color: #fff;
      padding: 14px 28px;
      border-radius: 10px;
      font-size: 16px;
      z-index: 9999;
      pointer-events: none;
      animation: wa-fade-in 0.2s ease;
    }

    @keyframes wa-fade-in {
      from { opacity: 0; transform: translate(-50%,-50%) scale(0.9); }
      to { opacity: 1; transform: translate(-50%,-50%) scale(1); }
    }
  </style>
</head>
<body>
  <div class="signin-page">
    <!-- Banner -->
    <div class="signin-banner">
      <button class="banner-reset-btn" id="reset-btn">重置</button>
      <div class="banner-title-wrap">
        <span class="banner-title">七日签到</span>
        <span class="banner-title-en">SEVEN DAYS</span>
      </div>
      <div class="banner-subtitle">
        连续签到 <span class="highlight">7</span> 天可获得角色
        <span class="highlight reward-name" id="banner-reward">夏日祭·祁朔</span>
      </div>
      <div class="banner-streak" id="streak-display">连续签到 0 天</div>
      <div class="banner-note">注：中断签到将会重新计算天数</div>
      <img class="banner-character-placeholder" id="banner-character" src="./signin_character.png" alt="" />
    </div>

    <!-- 7天列表 -->
    <div class="signin-days" id="signin-days"></div>

    <!-- 底部连续登录 -->
    <div class="signin-footer">
      <div class="footer-title">连续登录</div>
      <div class="footer-card">
        <div class="footer-card-info">
          7日签到奖励：<span class="reward-highlight">限定角色 ×1</span>
        </div>
        <div class="footer-card-image" id="footer-reward-img">
          <img src="./signin_reward.png" alt="" />
        </div>
      </div>
    </div>
  </div>

  <div id="waToast"></div>

  <script>
    ;(function() {
      var storage = window.__avgLLM_storage
      var economy = window.__avgLLM_economy
      var updateEconomy = window.__avgLLM_updateEconomy
      var activity = window.__avgLLM_activity

      function call(mod, fn, args) {
        var nextId = window.__signin_callId = (window.__signin_callId || 0) + 1
        var pending = window.__signin_pending = window.__signin_pending || {}
        pending[nextId] = { resolve: function(v) { pending[nextId] = null }, reject: function(e) { pending[nextId] = null } }
        parent.postMessage({ __avgLLM: true, id: nextId, mod: mod, fn: fn, args: args }, '*')
      }

      // 签到奖励配置
      var REWARDS = [
        { day: 1, name: '金币', type: '货币', amount: 1000, icon: '🪙', iconImg: './reward_coin.png' },
        { day: 2, name: '钻石', type: '货币', amount: 100, icon: '💎', iconImg: './reward_diamond.png' },
        { day: 3, name: '金币', type: '货币', amount: 1000, icon: '🪙', iconImg: './reward_coin.png' },
        { day: 4, name: '钻石', type: '货币', amount: 100, icon: '💎', iconImg: './reward_diamond.png' },
        { day: 5, name: '金币', type: '货币', amount: 1500, icon: '🪙', iconImg: './reward_coin.png' },
        { day: 6, name: '钻石', type: '货币', amount: 100, icon: '💎', iconImg: './reward_diamond.png' },
        { day: 7, name: '限定角色', type: '角色', amount: 1, icon: '🎴', iconImg: './reward_character.png' }
      ]

      var ENGLISH_NAMES = ['FIRST', 'SECOND', 'THIRD', 'FOURTH', 'FIFTH', 'SIXTH', 'SEVENTH']

      var signData = { claimed: [], lastSignDate: null, streak: 0 }
      var toastTimer = null

      function getTodayStr() {
        var d = new Date()
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate()
      }

      function getDaysDiff(date1, date2) {
        var d1 = new Date(date1)
        var d2 = new Date(date2)
        var diff = Math.floor((d2 - d1) / (1000 * 60 * 60 * 24))
        return diff
      }

      function showToast(msg) {
        var el = document.getElementById('waToast')
        if (!el) return
        el.innerHTML = '<div class="wa-toast">' + msg + '</div>'
        clearTimeout(toastTimer)
        toastTimer = setTimeout(function() { el.innerHTML = '' }, 2000)
      }

      function showSigninSuccess(r) {
        var overlay = document.createElement('div')
        overlay.className = 'signin-success-overlay'

        // 创建粒子爆发
        for (var i = 0; i < 12; i++) {
          var sparkle = document.createElement('div')
          sparkle.className = 'signin-sparkle'
          var angle = (i / 12) * Math.PI * 2
          var distance = 80 + Math.random() * 40
          sparkle.style.setProperty('--tx', Math.cos(angle) * distance + 'px')
          sparkle.style.setProperty('--ty', Math.sin(angle) * distance + 'px')
          sparkle.style.left = '50%'
          sparkle.style.top = '50%'
          overlay.appendChild(sparkle)
        }

        var card = document.createElement('div')
        card.className = 'signin-success-card'

        var iconHtml = r.iconImg
          ? '<img src="' + r.iconImg + '" alt="" />'
          : '<span class="icon-placeholder">' + r.icon + '</span>'

        card.innerHTML =
          '<div class="signin-success-icon">' + iconHtml + '</div>' +
          '<div class="signin-success-text">签到成功</div>' +
          '<div class="signin-success-amount">' + r.name + ' ×' + r.amount + '</div>'

        overlay.appendChild(card)
        document.body.appendChild(overlay)

        setTimeout(function() {
          overlay.style.animation = 'overlay-fade-in 0.3s ease reverse forwards'
          setTimeout(function() {
            document.body.removeChild(overlay)
          }, 300)
        }, 1500)
      }

      function isClaimed(day) { return signData.claimed.indexOf(day) >= 0 }
      function isClaimable(day) {
        if (isClaimed(day)) return false
        if (signData.lastSignDate === getTodayStr()) return false
        return day === signData.claimed.length + 1
      }
      function canSignToday() {
        return signData.lastSignDate !== getTodayStr() && signData.claimed.length < 7
      }

      async function doClaim(day) {
        if (isClaimed(day) || !isClaimable(day)) return
        var r = REWARDS[day - 1]

        // 检查是否已经签到过今天
        if (signData.lastSignDate === getTodayStr()) {
          showToast('今日已签到，请明天再来')
          return
        }

        // 检查连续签到
        if (signData.lastSignDate && getDaysDiff(signData.lastSignDate, getTodayStr()) > 1) {
          // 中断了超过1天，重置签到进度
          signData.claimed = []
          signData.streak = 0
          day = 1
          r = REWARDS[0]
          showToast('签到中断，进度已重置')
        }

        signData.claimed.push(day)
        signData.lastSignDate = getTodayStr()
        signData.streak = signData.claimed.length

        // 更新全局数据
        if (window.__avgLLM_activityData) {
          window.__avgLLM_activityData.signup.claimed = signData.claimed
        }

        var wbId = await activity.getWorldBookId()
        await storage.set('signup_wasteland_pet_summer_' + wbId, signData)

        var newVal = {}
        if (r.type === '货币') {
          if (r.name === '金币') newVal.coins = (economy.value.coins || 0) + r.amount
          if (r.name === '钻石') newVal.crystals = (economy.value.crystals || 0) + r.amount
        }
        if (r.type === '角色') {
          call('cardCollection', 'addCard', ['card_wasteland_summer_ssr'])
        }
        if (Object.keys(newVal).length) updateEconomy(newVal)
        activity.notifyEvent('signup', 1)
        showSigninSuccess(r)
        renderDays()
      }

      function renderDays() {
        var container = document.getElementById('signin-days')
        if (!container) return
        container.innerHTML = ''

        // 更新banner显示连续签到天数
        var streakEl = document.getElementById('streak-display')
        if (streakEl) {
          streakEl.textContent = '连续签到 ' + signData.streak + ' 天'
        }

        REWARDS.forEach(function(r, i) {
          var day = i + 1
          var claimed_flag = isClaimed(day)
          var claimable = isClaimable(day)
          var alreadySignedToday = signData.lastSignDate === getTodayStr()

          var cardClass = claimed_flag ? 'claimed' : (claimable && !alreadySignedToday ? 'claimable' : 'unclaimed')

          var btnHtml = ''
          if (claimed_flag) {
            btnHtml = '<button class="day-btn done">已领取</button>'
          } else if (claimable && !alreadySignedToday) {
            btnHtml = '<button class="day-btn claim" data-day="' + day + '">领取</button>'
          } else if (alreadySignedToday) {
            btnHtml = '<button class="day-btn pending">明日可签</button>'
          } else {
            btnHtml = '<button class="day-btn pending">签到后领取</button>'
          }

          var newBadge = claimable ? '<span class="day-new-badge">NEW!</span>' : ''

          var iconHtml = r.iconImg
            ? '<img src="' + r.iconImg + '" alt="" />'
            : '<span class="icon-placeholder">' + r.icon + '</span>'

          var div = document.createElement('div')
          div.className = 'day-card ' + cardClass
          div.innerHTML =
            '<span class="corner-bl"></span><span class="corner-br"></span>' +
            '<span class="day-watermark">' + ENGLISH_NAMES[i] + '</span>' +
            newBadge +
            '<div class="day-left">' +
              '<span class="day-label">第</span>' +
              '<span class="day-number">' + day + '<span class="day-suffix">日</span></span>' +
            '</div>' +
            '<div class="day-center">' +
              '<div class="day-reward-icon">' +
                iconHtml +
                (r.amount ? '<span class="day-reward-amount">' + r.amount + '</span>' : '') +
              '</div>' +
              '<div class="day-reward-info">' +
                '<span class="day-reward-name">' + r.name + '</span>' +
                '<span class="day-reward-type">' + r.type + '</span>' +
              '</div>' +
            '</div>' +
            '<div class="day-right">' +
              btnHtml +
            '</div>'

          container.appendChild(div)
        })

        // 绑定领取按钮事件
        container.querySelectorAll('.day-btn.claim').forEach(function(btn) {
          btn.onclick = function() {
            doClaim(parseInt(btn.dataset.day))
          }
        })
      }

      // 初始化
      var currentWbId = null
      activity.getWorldBookId().then(function(wbId) {
        currentWbId = wbId
        storage.get('signup_wasteland_pet_summer_' + wbId).then(function(saved) {
          if (saved && typeof saved === 'object') {
            signData.claimed = saved.claimed || []
            signData.lastSignDate = saved.lastSignDate || null
            signData.streak = saved.streak || saved.claimed.length || 0
          } else if (Array.isArray(saved)) {
            // 兼容旧数据格式
            signData.claimed = saved
            signData.streak = saved.length
            signData.lastSignDate = null
          }

          // 检查是否需要重置（超过1天没签到）
          if (signData.lastSignDate && getDaysDiff(signData.lastSignDate, getTodayStr()) > 1 && signData.claimed.length < 7) {
            signData.claimed = []
            signData.streak = 0
          }

          // 更新全局数据
          if (window.__avgLLM_activityData) {
            window.__avgLLM_activityData.signup.claimed = signData.claimed
          }

          renderDays()
        })
      })

      // 重置按钮
      var resetBtn = document.getElementById('reset-btn')
      if (resetBtn) {
        resetBtn.addEventListener('click', function() {
          if (!currentWbId) return
          signData = { claimed: [], lastSignDate: null, streak: 0 }
          storage.remove('signup_wasteland_pet_summer_' + currentWbId)
          showToast('已重置签到进度')
          renderDays()
        })
      }
    })()
  </script>
</body>
</html>

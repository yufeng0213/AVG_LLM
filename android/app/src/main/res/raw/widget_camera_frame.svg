<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
  <!-- 定义滤镜和渐变 -->
  <defs>
    <!-- 暗角效果 -->
    <radialGradient id=" vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>

    <!-- 边角发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="300" height="200" fill="#0A0A12" rx="12"/>

  <!-- 暗角叠加层 -->
  <rect width="300" height="200" fill="url(#vignette)" rx="12"/>

  <!-- 外边框 -->
  <rect x="1" y="1" width="298" height="198" fill="none" stroke="#333333" stroke-width="1" rx="11"/>

  <!-- 四角取景框标记 -->
  <!-- 左上角 -->
  <path d="M 20 8 L 20 28 L 8 28" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="square" filter="url(#glow)"/>
  <!-- 右上角 -->
  <path d="M 280 8 L 280 28 L 292 28" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="square" filter="url(#glow)"/>
  <!-- 左下角 -->
  <path d="M 20 192 L 20 172 L 8 172" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="square" filter="url(#glow)"/>
  <!-- 右下角 -->
  <path d="M 280 192 L 280 172 L 292 172" fill="none" stroke="#00FF88" stroke-width="2" stroke-linecap="square" filter="url(#glow)"/>

  <!-- 扫描线效果（可选） -->
  <g opacity="0.03">
    <line x1="0" y1="40" x2="300" y2="40" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="80" x2="300" y2="80" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="120" x2="300" y2="120" stroke="#FFFFFF" stroke-width="1"/>
    <line x1="0" y1="160" x2="300" y2="160" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- 顶部状态栏背景 -->
  <rect x="100" y="12" width="100" height="20" fill="#000000" fill-opacity="0.5" rx="3"/>

  <!-- REC 红点 -->
  <circle cx="115" cy="22" r="4" fill="#FF3333"/>

  <!-- REC 文字 -->
  <text x="125" y="26" font-family="monospace" font-size="11" fill="#FF3333" font-weight="bold">REC</text>

  <!-- 时间戳 -->
  <text x="150" y="26" font-family="monospace" font-size="11" fill="#FFFFFF" opacity="0.7">00:00:00</text>
</svg>